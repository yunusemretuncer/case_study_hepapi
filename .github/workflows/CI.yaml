name: CI

on: push

jobs:
    login:
      runs-on: ubuntu-latest
      services:
        mongodb:
          image: mongo:latest
          ports:
            - 27017:27017
      steps:
        - name: Checkout Repo
          uses: actions/checkout@v6

        - name: Login to Docker Hub
          uses: docker/login-action@v4
          with:
            username: ${{ vars.DOCKERHUB_USERNAME }}
            password: ${{ secrets.DOCKERHUB_PASSWORD }}

        - name: Docker Build
          uses: docker/build-push-action@v7
          with:
            push: true
            tags: ${{ vars.DOCKERHUB_USERNAME }}/case_study_hepapi-app:latest
        
        - name: Docker image Testing
          run: |
            docker images
            docker run --name case_study_hepapi-app -d \
              --network host \
              -e MONGO_URI="mongodb://localhost:27017" \
              -e MONGO_PASSWORD="${{ secrets.MONGO_PASSWORD }}" \
              ${{ vars.DOCKERHUB_USERNAME }}/case_study_hepapi-app:latest


            sleep 10
            echo Testing Image URL using wget
            wget -q -O - 127.0.0.1:5000/
