name: CI

on: push

jobs:
    unit-testing:
        name: Unit Testing
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Code
              uses: actions/checkout@v6

            - name: Setup python
              uses: actions/checkout@v7
              with:
                python-version: "3.12"

            - name: Install Dependencies
              run: |
                pip install -r requirements.txt
                pip install pytest
              

            - name: test_script
              run: pytest