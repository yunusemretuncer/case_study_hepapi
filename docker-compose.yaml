services:
  db:
    image: mongo:latest
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: example
    volumes:
      - db-data:/var/lib/mongoDB

  app:
    build: 
      context: .
      dockerfile: Dockerfile
    ports: 
      - "5000:5000"
    depends_on:
      - db
volumes:
  db-data: